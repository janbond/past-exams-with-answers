<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>考古題複習</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-header">
  <div class="title-row">
    <h1><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg></h1>
    <div class="search-wrap"><input id="searchBox" type="search" placeholder="搜尋題目關鍵字…"></div>
    <span id="modeToggle" title="只看標記題目" style="display:inline-flex;color:var(--muted);cursor:pointer;"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></span>
    <span id="wrongToggle" title="只看答錯過的題目" style="display:inline-flex;color:var(--muted);cursor:pointer;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg></span>
    <span id="cardModeToggle" title="跳到上次瀏覽的題目（卡片模式）" style="display:inline-flex;color:var(--muted);cursor:pointer;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg></span>
  </div>
  <div class="tabbar" id="subjectTabs"></div>
</div>
<main id="main"></main>
<div class="stats-bar" id="statsBar"><span id="statLeft">—</span><span id="statRight">—</span></div>

<script src="app.js"></script>
</body>
</html>
